<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acak Kelompok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pembuat Kelompok Acak</h1>
        
        <div class="input-group">
            <label for="fileInput">1. Upload File (.txt):</label>
            <input type="file" id="fileInput" accept=".txt">
            <small>Setiap baris di dalam file akan dihitung sebagai 1 nama.</small>
        </div>

        <div class="input-group">
            <label for="groupCount">2. Jumlah Kelompok:</label>
            <input type="number" id="groupCount" min="1" placeholder="Masukkan angka...">
        </div>

        <button id="generateBtn">Buat Kelompok</button>

        <div id="outputContainer" class="hidden">
            <div class="output-header">
                <h2>Hasil Pembagian:</h2>
                <button id="copyBtn">Salin Hasil</button>
            </div>
            <pre id="resultText"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
