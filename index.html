<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembagi Kelompok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],
                    },
                    colors: {
                        stone: {
                            50: '#F7F5F0',
                            100: '#EAE6DF',
                            800: '#2C2A28',
                            900: '#1A1918'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F7F5F0; color: #2C2A28; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 lg:p-16">
    <header class="mb-12 md:mb-16 border-b border-stone-800/10 pb-6 md:pb-8">
        <h1 class="font-serif text-5xl md:text-7xl text-stone-900 mb-4 tracking-tight">Pembagi<br>Kelompok.</h1>
        <p class="text-stone-800/70 text-lg md:text-xl font-medium max-w-md">Distribusi nama secara acak dan proporsional untuk keperluan kolaborasi.</p>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-24">
        <!-- Kolom Kiri: Input Area (Proporsi lebih kecil) -->
        <section class="lg:col-span-4 flex flex-col gap-8">
            <div class="space-y-4">
                <label class="block text-sm font-semibold uppercase tracking-wider text-stone-900">1. Unggah Daftar Nama</label>
                <div class="relative group">
                    <div class="absolute inset-0 bg-stone-100 border border-stone-800/20 rounded-lg group-hover:bg-stone-200 transition-colors"></div>
                    <input type="file" id="file-upload" accept=".txt" class="relative z-10 w-full h-full opacity-0 cursor-pointer py-6" />
                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center text-stone-800/60 font-medium">
                        Pilih file .txt
                    </div>
                </div>
                <p id="file-status" class="text-sm text-stone-800/50">Belum ada file terpilih.</p>
            </div>

            <div class="space-y-4">
                <label class="block text-sm font-semibold uppercase tracking-wider text-stone-900">2. Konfigurasi</label>
                <div class="flex items-center gap-4">
                    <input type="number" id="group-count" min="1" placeholder="Jumlah" class="w-full bg-transparent border-b border-stone-800/20 py-2 px-1 text-2xl font-serif focus:outline-none focus:border-stone-800 transition-colors placeholder:text-stone-800/30">
                    <span class="text-stone-800/50">kelompok</span>
                </div>
            </div>

            <button id="generate-btn" class="mt-4 bg-stone-900 text-stone-50 py-4 px-8 rounded-full font-medium hover:bg-stone-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Acak & Bagikan
            </button>
        </section>

        <!-- Kolom Kanan: Results Area (Proporsi lebih besar) -->
        <section class="lg:col-span-8">
            <div class="flex items-end justify-between border-b border-stone-800/10 pb-4 mb-8">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-stone-900">Hasil Distribusi</h2>
                <span id="total-names" class="font-serif text-2xl text-stone-800/50">0 Nama</span>
            </div>
            
            <!-- Tempat hasil kelompok akan di-render -->
            <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-16">
                <div class="text-stone-800/40 italic">Menunggu konfigurasi...</div>
            </div>
        </section>
    </main>

    <!-- Memanggil file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
